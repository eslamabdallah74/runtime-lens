name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VSCE_PAT: ${{ secrets.VSCE_PAT }}
  OVSX_PAT: ${{ secrets.OVSX_PAT }}

jobs:
  extension:
    name: Publish the editor extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Check the tag matches the extension version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package

      - name: Attach the .vsix to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: extension/runtime-lens-*.vsix
          generate_release_notes: true

      - name: Warn about missing publishing tokens
        run: |
          [ -n "$VSCE_PAT" ] || echo "::warning::VSCE_PAT is not set, so the VS Code Marketplace was skipped"
          [ -n "$OVSX_PAT" ] || echo "::warning::OVSX_PAT is not set, so Open VSX was skipped"

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --skip-duplicate --packagePath "$(ls runtime-lens-*.vsix)"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "$(ls runtime-lens-*.vsix)" --pat "$OVSX_PAT" --skip-duplicate
